name: Android tools
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Metronome core regression
        run: bash scripts/run-v02-probe.sh
      - name: Build and existing unit tests
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Prepare APK and verification data
        run: |
          mkdir -p dist
          APP_VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle)
          cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/TuneBeat-${APP_VERSION}-unsigned.apk"
          cp "$ANDROID_HOME/build-tools/36.1.0/lib/apksigner.jar" dist/apksigner.jar
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging dist/*-unsigned.apk > dist/package.txt
          git rev-parse HEAD > dist/source-sha.txt
          cd dist
          sha256sum *-unsigned.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: TuneBeat-build
          path: dist/
          if-no-files-found: error
      - name: Fetch pinned original for side-by-side install
        run: |
          curl --fail --location --retry 3 https://github.com/grizzlyfute/Diatronome/releases/download/1.0.15/app-release.apk -o /tmp/diatronome.apk
          echo '28d13c370a5ce264e90aee0123663c2c79e0821ad925d045aa4ad57f59afb1dd  /tmp/diatronome.apk' | sha256sum --check
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator installation and core smoke checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash scripts/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tool-verification
          path: |
            app/build/reports/tests/
            app/build/outputs/androidTest-results/
            verification/
